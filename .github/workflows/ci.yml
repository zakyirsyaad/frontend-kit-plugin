name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: node --test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      # actions pinned to commit SHAs (checkout v7.0.1, setup-node v7.0.0)
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: Unit tests (offline)
        shell: bash
        run: node --test "tests/**/*.test.mjs"

  validate:
    name: plugin manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24'
      - name: claude plugin validate (skipped when the CLI is unavailable)
        shell: bash
        run: |
          if command -v claude >/dev/null 2>&1; then
            claude plugin validate . --strict
          else
            echo "claude CLI not available on the runner; manifest schema is covered by tests/manifest.test.mjs"
          fi
      - name: Manifest schema and version sync
        shell: bash
        run: node --test tests/manifest.test.mjs
